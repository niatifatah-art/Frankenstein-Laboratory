# Machine-readable provenance/integration registry.
# "verified" here means the named source was checked at the recorded upstream.
# Code, model-weight, dataset, and voice-asset licensing remain separate concerns.

[engine.kokoro]
name = "Kokoro"
upstream = "https://github.com/hexgrad/kokoro"
zone = "runtime"
integration_status = "ready"
code_license = "Apache-2.0"
weights_license = "Apache-2.0"
license_status = "partially_verified"
worker = "kokoro"
notes = "82M lightweight backend. Two real-model CPU smoke runs passed on GitHub Ubuntu; dataset/provenance review remains separate from code/weights licensing."

