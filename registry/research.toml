# Research-zone systems. These records are intentionally separate from runtime engines.
# `researching` means useful enough to study but not qualified for product routing.
# Code and weights licenses are tracked separately whenever upstream makes that distinction.

[engine.dia2]
name = "Dia2"
family = "Dia"
kind = "tts_dialogue"
version = "1B/2B family"
upstream = "https://github.com/nari-labs/dia2"
zone = "research"
integration_status = "researching"
code_license = "Apache-2.0"
weights_license = "model_card_verification_required"
license_status = "partially_verified"
commercial_use = "checkpoint_dependent"
attribution = "Apache-2.0 for repository code; verify selected model card before shipping weights."
dataset_notes = "Training-data and released-checkpoint provenance require separate review."
verified_on = "2026-08-18"
capabilities = ["dialogue", "streaming", "long_form"]
languages = ["en"]
hardware = ["cuda_recommended"]
restrictions = []
notes = "Current Nari Labs generation after Dia; architecture candidate for streaming dialogue and multi-speaker state."

