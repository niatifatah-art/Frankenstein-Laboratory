name: pocket-tts-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Run isolated Pocket TTS streaming synthesis
        run: |
          mkdir -p outputs
          uv run --project engines/pocket_tts \
            python engines/pocket_tts/runner.py \
            --text "Hello from Frankenstein Laboratory. This is the first real Pocket TTS smoke test." \
            --output outputs/pocket-tts-smoke.wav

      - name: Validate WAV header
        run: |
          python - <<'PY'
          import wave
          from pathlib import Path
          path = Path("outputs/pocket-tts-smoke.wav")
          assert path.exists() and path.stat().st_size > 1000
          with wave.open(str(path), "rb") as wav:
              assert wav.getframerate() > 0
              assert wav.getnframes() > 2400
          print(path, path.stat().st_size)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-tts-smoke-audio
          path: outputs/pocket-tts-smoke.wav
          if-no-files-found: error
