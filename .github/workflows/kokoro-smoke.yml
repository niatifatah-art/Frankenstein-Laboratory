name: kokoro-smoke

on:
  pull_request:
    paths:
      - "engines/kokoro/**"
      - "src/ttslab/isolation.py"
      - ".github/workflows/kokoro-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system runtime
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Run isolated Kokoro synthesis
        run: |
          mkdir -p outputs
          uv run --project engines/kokoro \
            python engines/kokoro/runner.py \
            --text "Hello from Frankenstein Laboratory. This is the first real Kokoro smoke test." \
            --output outputs/kokoro-smoke.wav

      - name: Validate WAV header
        run: |
          python - <<'PY'
          import wave
          from pathlib import Path
          path = Path("outputs/kokoro-smoke.wav")
          assert path.exists() and path.stat().st_size > 1000
          with wave.open(str(path), "rb") as wav:
              assert wav.getframerate() == 24000
              assert wav.getnframes() > 2400
          print(path, path.stat().st_size)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-smoke-audio
          path: outputs/kokoro-smoke.wav
          if-no-files-found: error
