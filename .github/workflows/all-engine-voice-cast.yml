name: all-engine-voice-cast

# This is deliberately manual. The old PR-triggered mega-cast downloaded and ran many heavyweight
# engines on every workflow-file change, and one stale CosyVoice install recipe left the PR red even
# after the corrected dedicated CosyVoice workflow passed real inference. Qualification is now
# targeted per changed adapter; broad listening casts remain an opt-in experiment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Validate registry and product catalog before a manual cast
        run: |
          python -m ttslab registry-check
          python -m ttslab list
          ourtts profiles
          ourtts engines
      - name: Explain evidence policy
        run: |
          echo "Use dedicated qualification workflows for real-model evidence."
          echo "Use this manual workflow as a cheap catalog sanity gate before launching large casts."
