name: all-engine-voice-cast

on:
  pull_request:
    paths:
      - ".github/workflows/all-engine-voice-cast.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CAST_TEXT: >-
    I had a terrible idea. What if instead of choosing one text to speech model,
    I just used all of them? So I made Frankenstein Laboratory. And somehow,
    it already speaks.
  REF_TEXT: >-
    This is a synthetic reference voice created inside Frankenstein Laboratory
    for controlled text to speech experiments.

jobs:
  kokoro:
    name: Kokoro — 5 preset voices
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: python -m pip install --upgrade uv
      - name: Render five voices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/kokoro
          voices=(bm_fable am_puck am_fenrir am_michael bm_george)
          i=1
          for voice in "${voices[@]}"; do
            uv run --project engines/kokoro python engines/kokoro/runner.py \
              --voice "$voice" --language b --text "$CAST_TEXT" \
              --output "outputs/kokoro/$(printf '%02d' "$i")-$voice.wav" \
              > "outputs/kokoro/$(printf '%02d' "$i")-$voice.json"
            i=$((i+1))
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cast-kokoro-5
          path: outputs/kokoro/
          if-no-files-found: error

  pocket:
    name: Pocket TTS — 5 catalog voices
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade uv
      - name: Render five voices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/pocket
          voices=(bill_boerst charles george michael stuart_bell)
          i=1
          for voice in "${voices[@]}"; do
            uv run --project engines/pocket_tts python engines/pocket_tts/runner.py \
              --voice "$voice" --language english --text "$CAST_TEXT" \
              --output "outputs/pocket/$(printf '%02d' "$i")-$voice.wav" \
              > "outputs/pocket/$(printf '%02d' "$i")-$voice.json"
            i=$((i+1))
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cast-pocket-5
          path: outputs/pocket/
          if-no-files-found: error

  openvoice:
    name: OpenVoice V2 — 5 tone-color targets
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: python -m pip install --upgrade uv
      - name: Make controlled synthetic source and references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/openvoice/refs
          uv run --project engines/kokoro python engines/kokoro/runner.py \
            --voice bm_fable --language b --text "$CAST_TEXT" \
            --output outputs/openvoice/source.wav >/dev/null
          voices=(am_puck am_fenrir am_michael bm_george bm_lewis)
          i=1
          for voice in "${voices[@]}"; do
            lang=a
            [[ "$voice" == bm_* ]] && lang=b
            uv run --project engines/kokoro python engines/kokoro/runner.py \
              --voice "$voice" --language "$lang" --text "$REF_TEXT" \
              --output "outputs/openvoice/refs/$(printf '%02d' "$i")-$voice.wav" >/dev/null
            i=$((i+1))
          done
      - name: Install OpenVoice converter-only runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          git clone https://github.com/myshell-ai/OpenVoice.git /tmp/OpenVoice
          git -C /tmp/OpenVoice checkout 74a1d147b17a8c3092dd5430504bd83ef6c7eb23
          python -m pip install -e /tmp/OpenVoice --no-deps
          python -m pip install \
            huggingface_hub wavmark==0.0.3 numpy==1.22.0 librosa==0.9.1 soundfile \
            eng_to_ipa==0.0.2 inflect==7.0.0 unidecode==1.3.7 \
            pypinyin==0.50.0 cn2an==0.5.22 jieba==0.42.1 langid==1.1.6
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='myshell-ai/OpenVoiceV2',
              revision='fd981100305a0e4291f93a9ad169c6d9f7bed54a',
              allow_patterns=['converter/*'],
              local_dir='/tmp/OpenVoice/checkpoints_v2',
          )
          PY
      - name: Convert source into five target identities
        shell: bash
        run: |
          set +e
          python - <<'PY' > outputs/openvoice/run.log 2>&1
          from pathlib import Path
          from openvoice.api import ToneColorConverter
          root = Path('/tmp/OpenVoice/checkpoints_v2/converter')
          out = Path('outputs/openvoice')
          converter = ToneColorConverter(str(root / 'config.json'), device='cpu')
          converter.load_ckpt(str(root / 'checkpoint.pth'))
          src = converter.extract_se(str(out / 'source.wav'))
          for ref in sorted((out / 'refs').glob('*.wav')):
              tgt = converter.extract_se(str(ref))
              converter.convert(
                  audio_src_path=str(out / 'source.wav'), src_se=src, tgt_se=tgt,
                  output_path=str(out / ('converted-' + ref.name)),
                  message='FrankensteinLab',
              )
          PY
          echo $? > outputs/openvoice/exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cast-openvoice-v2-5
          path: outputs/openvoice/
          if-no-files-found: error

  chatterbox:
    name: Chatterbox Nano — 5 synthetic voice clones
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: python -m pip install --upgrade uv
      - name: Make five synthetic references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/chatterbox/refs
          voices=(bm_fable am_puck am_fenrir am_michael bm_george)
          i=1
          for voice in "${voices[@]}"; do
            lang=a
            [[ "$voice" == bm_* ]] && lang=b
            uv run --project engines/kokoro python engines/kokoro/runner.py \
              --voice "$voice" --language "$lang" --text "$REF_TEXT" \
              --output "outputs/chatterbox/refs/$(printf '%02d' "$i")-$voice.wav" >/dev/null
            i=$((i+1))
          done
      - name: Install Chatterbox Nano CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          git clone --depth 1 https://github.com/resemble-ai/chatterbox.git /tmp/chatterbox
          python -m pip install -e /tmp/chatterbox --no-deps
          python -m pip install \
            'numpy>=1.24,<2' librosa==0.11.0 s3tokenizer transformers==5.2.0 \
            diffusers==0.29.0 'resemble-perth @ git+https://github.com/resemble-ai/Perth.git@master' \
            conformer==0.3.2 safetensors==0.5.3 spacy-pkuseg pykakasi==2.3.0 \
            pyloudnorm omegaconf
      - name: Render five cloned voices
        shell: bash
        run: |
          set +e
          python - <<'PY' > outputs/chatterbox/run.log 2>&1
          import os
          from pathlib import Path
          import torch
          import torchaudio as ta
          from chatterbox.tts_turbo import ChatterboxTurboTTS
          torch.set_num_threads(2)
          text = os.environ['CAST_TEXT']
          root = Path('outputs/chatterbox')
          model = ChatterboxTurboTTS.from_pretrained(device='cpu', nano=True)
          for ref in sorted((root / 'refs').glob('*.wav')):
              wav = model.generate(text, audio_prompt_path=str(ref))
              ta.save(str(root / ('nano-' + ref.name)), wav.cpu(), model.sr)
          PY
          echo $? > outputs/chatterbox/exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cast-chatterbox-nano-5
          path: outputs/chatterbox/
          if-no-files-found: error

  qwen:
    name: Qwen3-TTS 0.6B — 5 custom speakers
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          python -m pip install -U qwen-tts soundfile
      - name: Render five speakers
        shell: bash
        run: |
          set +e
          mkdir -p outputs/qwen
          python - <<'PY' > outputs/qwen/run.log 2>&1
          import os
          import soundfile as sf
          import torch
          from qwen_tts import Qwen3TTSModel
          torch.set_num_threads(2)
          model = Qwen3TTSModel.from_pretrained(
              'Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice',
              device_map='cpu', dtype=torch.float32, attn_implementation='sdpa',
          )
          speakers = ['Ryan', 'Aiden', 'Dylan', 'Eric', 'Uncle_Fu']
          text = os.environ['CAST_TEXT']
          wavs, sr = model.generate_custom_voice(
              text=[text] * len(speakers), language=['English'] * len(speakers),
              speaker=speakers, instruct=[''] * len(speakers), max_new_tokens=1024,
          )
          for i, (speaker, wav) in enumerate(zip(speakers, wavs), 1):
              sf.write(f'outputs/qwen/{i:02d}-{speaker}.wav', wav, sr)
          PY
          echo $? > outputs/qwen/exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cast-qwen3-tts-5
          path: outputs/qwen/
          if-no-files-found: error

  cosyvoice:
    name: CosyVoice3 0.5B — 5 zero-shot synthetic voices
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng sox libsox-dev
      - run: python -m pip install --upgrade uv
      - name: Make five synthetic references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/cosyvoice/refs
          voices=(bm_fable am_puck am_fenrir am_michael bm_george)
          i=1
          for voice in "${voices[@]}"; do
            lang=a
            [[ "$voice" == bm_* ]] && lang=b
            uv run --project engines/kokoro python engines/kokoro/runner.py \
              --voice "$voice" --language "$lang" --text "$REF_TEXT" \
              --output "outputs/cosyvoice/refs/$(printf '%02d' "$i")-$voice.wav" >/dev/null
            i=$((i+1))
          done
      - name: Install CosyVoice3 CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/FunAudioLLM/CosyVoice.git /tmp/CosyVoice
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.3.1 torchaudio==2.3.1
          grep -vE '^(--extra-index-url|deepspeed==|onnxruntime-gpu==|tensorrt-cu12|torch==|torchaudio==)' /tmp/CosyVoice/requirements.txt > /tmp/cosy-cpu-requirements.txt
          python -m pip install -r /tmp/cosy-cpu-requirements.txt onnxruntime==1.18.0
          python -m pip install huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download('FunAudioLLM/Fun-CosyVoice3-0.5B-2512', local_dir='/tmp/CosyVoice/pretrained_models/Fun-CosyVoice3-0.5B')
          PY
      - name: Render five zero-shot voices
        shell: bash
        run: |
          set +e
          python - <<'PY' > outputs/cosyvoice/run.log 2>&1
          import os, sys
          from pathlib import Path
          import torch
          import torchaudio
          sys.path.insert(0, '/tmp/CosyVoice')
          sys.path.insert(0, '/tmp/CosyVoice/third_party/Matcha-TTS')
          from cosyvoice.cli.cosyvoice import AutoModel
          torch.set_num_threads(2)
          root = Path('outputs/cosyvoice')
          model = AutoModel(model_dir='/tmp/CosyVoice/pretrained_models/Fun-CosyVoice3-0.5B', load_vllm=False, fp16=False)
          prompt = 'You are a helpful assistant.<|endofprompt|>' + os.environ['REF_TEXT']
          for ref in sorted((root / 'refs').glob('*.wav')):
              chunks = [x['tts_speech'].cpu() for x in model.inference_zero_shot(os.environ['CAST_TEXT'], prompt, str(ref), stream=False)]
              wav = torch.cat(chunks, dim=1)
              torchaudio.save(str(root / ('cosy3-' + ref.name)), wav, model.sample_rate)
          PY
          echo $? > outputs/cosyvoice/exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cast-cosyvoice3-5
          path: outputs/cosyvoice/
          if-no-files-found: error

  voxcpm:
    name: VoxCPM2 — 5 native Voice Design prompts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU runtime and VoxCPM2
        shell: bash
        run: |
          set +e
          mkdir -p outputs/voxcpm
          python -m pip install --upgrade pip > outputs/voxcpm/install.log 2>&1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.5' torchaudio >> outputs/voxcpm/install.log 2>&1
          python -m pip install voxcpm soundfile >> outputs/voxcpm/install.log 2>&1
          echo $? > outputs/voxcpm/install-exit-code.txt
          exit 0
      - name: Attempt five native Voice Design voices on CPU
        shell: bash
        run: |
          set +e
          python - <<'PY' > outputs/voxcpm/run.log 2>&1
          import os
          import soundfile as sf
          import torch
          from voxcpm import VoxCPM
          torch.set_num_threads(2)
          model = VoxCPM.from_pretrained('openbmb/VoxCPM2', load_denoiser=False, optimize=False, device='cpu')
          descriptions = [
              'Young British male voice, playful, quick-witted, clear and natural',
              'Young American male voice, energetic, warm and conversational',
              'Calm young male narrator, slightly deep, intimate and clean',
              'Playful young male creator voice, expressive, slightly sarcastic',
              'Bright youthful male voice, fast but articulate, friendly and confident',
          ]
          for i, desc in enumerate(descriptions, 1):
              wav = model.generate(text=f'({desc})' + os.environ['CAST_TEXT'], cfg_value=2.0, inference_timesteps=5, seed=100 + i)
              sf.write(f'outputs/voxcpm/{i:02d}-voice-design.wav', wav, model.tts_model.sample_rate)
          PY
          echo $? > outputs/voxcpm/exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cast-voxcpm2-5
          path: outputs/voxcpm/
          if-no-files-found: error
