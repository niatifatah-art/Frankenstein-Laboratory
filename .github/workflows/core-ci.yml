name: core-ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Research and product CLI smoke
        run: |
          python -m ttslab list
          python -m ttslab doctor
          ourtts profiles
          ourtts engines
          ourtts doctor
