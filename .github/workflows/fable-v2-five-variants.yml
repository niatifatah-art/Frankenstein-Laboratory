name: fable-v2-five-variants

on:
  pull_request:
    paths:
      - "experiments/fable_director.py"
      - ".github/workflows/fable-v2-five-variants.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system runtime
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Render five directed Fable variants
        run: |
          mkdir -p outputs/fable-v2
          uv run --project engines/kokoro \
            python experiments/fable_director.py \
            --output-dir outputs/fable-v2 | tee outputs/fable-v2/stdout.json
      - name: Validate five PCM WAV files
        run: |
          python - <<'PY'
          import json
          import wave
          from pathlib import Path

          root = Path('outputs/fable-v2')
          files = sorted(root.glob('*-bm-fable.wav'))
          assert len(files) == 5, files
          for path in files:
              with wave.open(str(path), 'rb') as wav:
                  assert wav.getframerate() == 24000
                  assert wav.getnframes() > 2400
              print(path.name, path.stat().st_size)

          manifest = json.loads((root / 'manifest.json').read_text())
          assert len(manifest['variants']) == 5
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fable-v2-five-variants
          path: outputs/fable-v2/
          if-no-files-found: error
