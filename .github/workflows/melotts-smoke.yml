name: melotts-smoke

on:
  pull_request:
    paths:
      - "engines/melotts/**"
      - ".github/workflows/melotts-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade uv
      - name: MeloTTS English CPU synthesis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          uv run --project engines/melotts python engines/melotts/runner.py \
            --language EN --device cpu \
            --text "Frankenstein Laboratory verifies the fixed Melo T T S worker." \
            --output outputs/melotts.wav | tee outputs/melotts.json
      - name: Validate PCM WAV
        run: |
          python - <<'PY'
          import wave
          with wave.open('outputs/melotts.wav', 'rb') as wav:
              assert wav.getframerate() > 0
              assert wav.getnframes() > 2400
              print(wav.getframerate(), wav.getnframes())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: melotts-fixed-qualification
          path: outputs/
          if-no-files-found: ignore
