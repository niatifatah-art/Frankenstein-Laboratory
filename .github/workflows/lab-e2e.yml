name: lab-e2e

on:
  pull_request:
    paths:
      - "src/ttslab/**"
      - "registry/**"
      - "examples/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/lab-e2e.yml"
  workflow_dispatch:

jobs:
  owned-core-and-real-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: python -m pip install --upgrade uv && python -m pip install -e ".[dev]"

      - name: Validate research Core and product catalog
        run: |
          python -m ttslab registry-check
          python -m ttslab lexicon-check examples/pronunciation-v1.json
          python -m ttslab prosody-check examples/prosody-v1.json
          python -m ttslab voicepack-check examples/voicepack-v1 --skip-hashes
          python -m ttslab route --language en --prefer streaming --max-generation-rtf 2
          ourtts profiles
          ourtts engines
          ourtts doctor

      - name: Real product path — pronunciation plus exact digital pause
        run: |
          mkdir -p outputs
          ourtts speak \
            --engine kokoro \
            --profile fast_cpu \
            --language en \
            --voice af_heart \
            --lexicon examples/pronunciation-v1.json \
            --text "Yessss! [[pause:320ms]] It actually works." \
            --output outputs/ourtts-v04.wav \
            --no-cache \
            > outputs/ourtts-v04.json

      - name: Verify product JSON, PCM audio and exact inserted silence
        run: |
          python - <<'PY'
          import json
          import struct
          import wave
          from pathlib import Path

          data = json.loads(Path("outputs/ourtts-v04.json").read_text())
          assert data["engine"] == "kokoro", data
          assert data["exact_pause_ms"] == 320, data
          assert data["segments"] == 2, data
          assert data["degraded_controls"] == [], data

          wav_path = Path(data["output_path"])
          with wave.open(str(wav_path), "rb") as wav:
              assert wav.getnchannels() == 1
              assert wav.getsampwidth() == 2
              assert wav.getframerate() == 24000
              raw = wav.readframes(wav.getnframes())
          samples = struct.unpack("<" + "h" * (len(raw) // 2), raw)
          longest = run = 0
          for sample in samples:
              if sample == 0:
                  run += 1
                  longest = max(longest, run)
              else:
                  run = 0
          assert longest >= round(0.30 * 24000), longest
          print(json.dumps({"longest_zero_run_frames": longest, "result": data}))
          PY

      - name: Keep the existing benchmark contract alive
        run: |
          python -m ttslab benchmark pocket_tts \
            --case en_basic \
            --output-dir outputs \
            --result outputs/pocket-en-basic.json

      - uses: actions/upload-artifact@v4
        with:
          name: lab-e2e-v04-product
          path: outputs/
          if-no-files-found: error
