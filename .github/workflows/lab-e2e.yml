name: lab-e2e

on:
  workflow_dispatch:

jobs:
  benchmark-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: python -m pip install --upgrade uv && python -m pip install -e ".[dev]"
      - name: Registry and routing
        run: |
          python -m ttslab registry-check
          python -m ttslab route --require cpu --prefer streaming --language en
      - name: Benchmark through Core contract
        run: |
          python -m ttslab benchmark pocket_tts \
            --case en_basic \
            --output-dir outputs \
            --result outputs/pocket-en-basic.json
      - name: Verify structured result
        run: |
          python - <<'PY'
          import json, wave
          from pathlib import Path
          data = json.loads(Path('outputs/pocket-en-basic.json').read_text())
          assert data['status'] == 'passed', data
          audio = data['audio']
          assert audio['sha256'] and audio['duration_seconds'] > 0
          wav_path = Path(audio['path'])
          with wave.open(str(wav_path), 'rb') as wav:
              assert wav.getframerate() > 0 and wav.getnframes() > 1000
          print(data['engine'], data['case']['key'], audio['sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lab-e2e-pocket-benchmark
          path: outputs/
          if-no-files-found: error
