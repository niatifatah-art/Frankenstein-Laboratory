name: ourtts-v07-prepared-voice-e2e

on:
  pull_request:
    paths:
      - "src/ttslab/voicepack.py"
      - "src/ttslab/voice_prepare.py"
      - "src/ttslab/isolation.py"
      - "src/ttslab/adapter_runtime.py"
      - "src/ttslab/rendering.py"
      - "src/ttslab/product_runtime.py"
      - "src/ttslab/product_cli.py"
      - "engines/chatterbox/**"
      - "engines/kokoro/**"
      - ".github/workflows/ourtts-v07-prepared-voice-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-and-reuse:
    name: VoicePack reference -> prepared state -> real WAV
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Core and worker tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python -m pip install --upgrade uv
          python -m pip install -e ".[dev]"
      - name: Create controlled synthetic reference
        run: |
          set -euo pipefail
          mkdir -p outputs/v07-voice/refs
          uv run --project engines/kokoro python engines/kokoro/runner.py \
            --voice bm_fable --language b \
            --text "This is a controlled synthetic reference created inside the laboratory. It is deliberately longer than five seconds so the voice preparation path receives a valid prompt and can be tested without using a real person's voice." \
            --output outputs/v07-voice/refs/reference.wav \
            > outputs/v07-voice/reference-generation.json
      - name: Build provenance-aware VoicePack
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("outputs/v07-voice")
          ref = root / "refs/reference.wav"
          digest = hashlib.sha256(ref.read_bytes()).hexdigest()
          payload = {
              "schema_version": 1,
              "voice_id": "lab_prepared_fable",
              "display_name": "Lab Prepared Fable",
              "languages": ["en"],
              "references": [{
                  "path": "refs/reference.wav",
                  "sha256": digest,
                  "license": "generated-in-lab",
                  "source": "Kokoro bm_fable controlled synthetic reference",
                  "consent": "synthetic",
              }],
              "backend_states": [],
              "style_presets": {},
              "provenance": {
                  "synthetic": True,
                  "purpose": "ourTTS v0.7 prepared voice E2E",
              },
          }
          (root / "voicepack.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          python -m ttslab voicepack-check outputs/v07-voice
      - name: Prepare reusable Chatterbox Nano state
        run: |
          ourtts voice prepare outputs/v07-voice \
            --engine chatterbox_nano \
            --timeout 2400 \
            --json > outputs/v07-voice/prepare-result.json
      - name: Validate registered prepared state
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("outputs/v07-voice")
          pack = json.loads((root / "voicepack.json").read_text())
          prepared = json.loads((root / "prepare-result.json").read_text())
          assert len(pack["backend_states"]) == 1, pack
          state = pack["backend_states"][0]
          assert state["engine"] == "chatterbox_nano"
          assert state["format"] == "chatterbox-conditionals-pt-v1"
          assert state["model_revision"] == "5de7a54aa4e5e2baadb0182dde554908b48b85c2"
          state_path = root / state["path"]
          assert state_path.is_file()
          assert hashlib.sha256(state_path.read_bytes()).hexdigest() == state["sha256"]
          assert prepared["sha256"] == state["sha256"]
          ref_hash = hashlib.sha256((root / "refs/reference.wav").read_bytes()).hexdigest()
          assert state["source_reference_sha256"] == ref_hash
          PY
      - name: Preview product route with cached identity
        run: |
          ourtts plan \
            --text "This sentence should reuse the prepared voice state." \
            --voicepack outputs/v07-voice \
            --language en \
            --quality auto \
            --json > outputs/v07-voice/plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("outputs/v07-voice/plan.json").read_text())
          assert plan["engine"] == "chatterbox_nano", plan
          assert plan["reference"] is None, plan
          assert plan["voice_state"], plan
          assert plan["metadata"]["voicepack"]["prepared_state"]["status"] == "used"
          PY
      - name: Render using state without raw reference
        run: |
          ourtts generate \
            --text "The reference was prepared once. This generation should load its cached voice state instead of preprocessing the raw reference again." \
            --voicepack outputs/v07-voice \
            --language en \
            --quality auto \
            --output outputs/v07-voice/rendered.wav \
            --manifest outputs/v07-voice/rendered.manifest.json \
            --timeout 2400 \
            --json > outputs/v07-voice/render-result.json
      - name: Validate state execution evidence and WAV
        run: |
          python - <<'PY'
          import json
          import wave
          from pathlib import Path

          root = Path("outputs/v07-voice")
          manifest = json.loads((root / "rendered.manifest.json").read_text())
          assert manifest["schema_version"] == 2
          assert manifest["engine"] == "chatterbox_nano"
          assert manifest["reference"] is None
          assert manifest["voice_state"]
          assert "--voice-state" in manifest["adapter_args"]
          assert "--reference" not in manifest["adapter_args"]
          payload = manifest["segments"][0]["worker_payload"]
          assert payload["engine"] == "chatterbox_nano"
          assert payload["reference"] is None
          assert payload["voice_state"]
          assert payload["voice_state_format"] == "chatterbox-conditionals-pt-v1"
          assert payload["voice_state_load_seconds"] is not None
          assert manifest["metadata"]["voicepack"]["prepared_state"]["status"] == "used"
          with wave.open(str(root / "rendered.wav"), "rb") as wav:
              assert wav.getnframes() > 1000
              assert wav.getnchannels() == 1
              assert wav.getframerate() > 0
          PY
      - name: Run lightweight regression suite
        run: |
          ruff check .
          pytest -q tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ourtts-v07-prepared-voice-e2e
          path: outputs/v07-voice/
          if-no-files-found: error
          retention-days: 14
