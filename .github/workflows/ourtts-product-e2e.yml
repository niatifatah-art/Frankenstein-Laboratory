name: ourtts-product-e2e

on:
  pull_request:
    paths:
      - "src/ttslab/product*.py"
      - "src/ttslab/quality.py"
      - "src/ttslab/rendering.py"
      - "src/ttslab/router.py"
      - "src/ttslab/adapter_runtime.py"
      - "benchmarks/quality/**"
      - "registry/**"
      - "engines/pocket_tts/**"
      - ".github/workflows/ourtts-product-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simple-auto-to-wav:
    name: Simple request -> Auto router -> real WAV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install product core
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python -m pip install --upgrade uv
          python -m pip install -e ".[dev]"
      - name: Preview Auto route
        run: |
          mkdir -p outputs/product
          ourtts plan \
            --text "Hello from ourTTS. This is the simple product path." \
            --language en \
            --quality auto \
            --json > outputs/product/plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("outputs/product/plan.json").read_text())
          assert plan["engine"] == "pocket_tts", plan
          assert plan["request"]["quality"] == "auto"
          assert plan["controls"] == {}
          PY
      - name: Verify Best stays evidence-gated
        run: |
          python - <<'PY'
          from ttslab.product_contract import GenerationRequest
          from ttslab.product_runtime import plan_generation

          try:
              plan_generation(GenerationRequest(text="Hello", language="en", quality="best"))
          except ValueError as exc:
              assert "No release-quality evidence" in str(exc), exc
          else:
              raise AssertionError("Best must not activate before measured quality evidence exists")
          PY
      - name: Generate through ourTTS product command
        run: |
          ourtts generate \
            --text "Hello from ourTTS. This is the simple product path." \
            --language en \
            --quality auto \
            --output outputs/product/hello.wav \
            --manifest outputs/product/hello.manifest.json \
            --json > outputs/product/result.json
      - name: Validate product result, routing evidence, and WAV
        run: |
          python - <<'PY'
          import json
          import wave
          from pathlib import Path

          root = Path("outputs/product")
          result = json.loads((root / "result.json").read_text())
          manifest = json.loads((root / "hello.manifest.json").read_text())

          assert result["status"] == "completed", result
          assert result["engine"] == "pocket_tts", result
          assert result["routing_reasons"], result
          assert manifest["engine"] == "pocket_tts", manifest
          assert manifest["metadata"]["product"]["name"] == "ourTTS"
          assert manifest["metadata"]["product"]["request"]["quality"] == "auto"
          assert manifest["metadata"]["product"]["routing"]["engine"] == "pocket_tts"
          assert manifest["metadata"]["product"]["routing"]["quality_evidence"] is None

          with wave.open(str(root / "hello.wav"), "rb") as wav:
              assert wav.getnframes() > 1000
              assert wav.getframerate() > 0
              assert wav.getnchannels() == 1
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ourtts-product-auto-e2e
          path: outputs/product/
          if-no-files-found: error
          retention-days: 14
