[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "frankenstein-tts-lab"
version = "0.3.0"
description = "A reproducible laboratory for evaluating and integrating open-source TTS systems."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
api = [
  "fastapi[standard-no-fastapi-cloud-cli]>=0.115,<1",
]

[project.scripts]
ttslab = "ttslab.cli:main"
ourtts = "ttslab.product_cli:main"
ourtts-api = "ttslab.product_api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
