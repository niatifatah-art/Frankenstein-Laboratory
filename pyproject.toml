[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "frankenstein-tts-lab"
version = "0.5.0"
description = "Frankenstein Laboratory research tooling and the modular ourTTS product core."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
studio = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
ttslab = "ttslab.cli:main"
ourtts = "ttslab.user_cli:main"
ourtts-studio = "ttslab.studio_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ttslab = ["studio/*.html", "studio/*.css", "studio/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
