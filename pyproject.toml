[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "frankenstein-tts-lab"
version = "0.10.0"
description = "ourTTS product core plus the Frankenstein Laboratory for reproducible TTS qualification."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
api = [
  "fastapi[standard-no-fastapi-cloud-cli]>=0.115,<1",
]

[project.scripts]
ttslab = "ttslab.entrypoints:lab_main"
ourtts = "ttslab.entrypoints:product_main"
ourtts-api = "ttslab.product_api:main"
ourtts-quality = "ttslab.quality_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ttslab = ["studio/*.html", "studio/*.css", "studio/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
