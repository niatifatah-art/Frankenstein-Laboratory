[project]
name = "frankenstein-openvoice-v2-component"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "huggingface-hub>=0.28",
  "wavmark==0.0.3",
  "numpy==1.22.0",
  "librosa==0.9.1",
  "soundfile>=0.12",
  "eng_to_ipa==0.0.2",
  "inflect==7.0.0",
  "unidecode==1.3.7",
  "pypinyin==0.50.0",
  "cn2an==0.5.22",
  "jieba==0.42.1",
  "langid==1.1.6",
  "torch==2.6.0",
  "torchaudio==2.6.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
