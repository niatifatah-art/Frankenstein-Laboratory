[project]
name = "frankenstein-pocket-tts-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pocket-tts[audio]==2.1.0",
  "torch>=2.5.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
