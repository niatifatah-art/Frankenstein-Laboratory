[project]
name = "frankenstein-voxcpm2-worker"
version = "0.2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
  "voxcpm",
  "torch",
  "torchaudio",
  "soundfile>=0.12",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
