[project]
name = "frankenstein-qwen3-tts-worker"
version = "0.2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "qwen-tts==0.1.1",
  "torch",
  "torchaudio",
  "soundfile>=0.12",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
