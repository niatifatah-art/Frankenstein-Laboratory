[project]
name = "frankenstein-kokoro-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "kokoro==0.9.4",
  "soundfile>=0.12,<1",
  "torch",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
